name: Recover stuck Pages deployment
on:
  push:
    branches: [main]
    paths: [.github/workflows/pages-recovery.yml]
permissions:
  contents: read
  pages: write
jobs:
  cancel-stuck-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read the conflicting Pages deployment state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/steffko81/telegram-rich-copy/pages/deployments/9b2d4b57b1add53df0d3dc9b2c138b7947e10ff3
